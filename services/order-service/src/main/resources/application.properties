spring.application.name=Order
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jackson.deserialization.accept-float-as-int=false
clients.cart-url=http://127.0.0.1:8082
clients.product-url=http://127.0.0.1:8081

# Dependency pembatalan Order v2; deployment Helm mengisi clients.payment-url.
clients.payment-url=http://127.0.0.1:8084

spring.http.serviceclient.carts.base-url=${clients.cart-url:http://127.0.0.1:8082}
spring.http.serviceclient.carts.connect-timeout=2s
spring.http.serviceclient.carts.read-timeout=4s
spring.http.serviceclient.carts.redirects=dont-follow

spring.http.serviceclient.products.base-url=${clients.product-url:http://127.0.0.1:8081}
spring.http.serviceclient.products.connect-timeout=2s
spring.http.serviceclient.products.read-timeout=4s
spring.http.serviceclient.products.redirects=dont-follow

spring.http.serviceclient.payments.base-url=${clients.payment-url:http://127.0.0.1:8084}
spring.http.serviceclient.payments.connect-timeout=2s
spring.http.serviceclient.payments.read-timeout=4s
spring.http.serviceclient.payments.redirects=dont-follow

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.threads.max=40
server.tomcat.accept-count=50
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000

spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.prometheus.metrics.export.enabled=true
management.tracing.propagation.type=w3c,b3
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}] 
