spring.application.name=Payment
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.jackson.deserialization.accept-float-as-int=false

spring.http.serviceclient.orders.base-url=${clients.order-url:http://127.0.0.1:8083}
spring.http.serviceclient.orders.connect-timeout=2s
spring.http.serviceclient.orders.read-timeout=5s
spring.http.serviceclient.orders.redirects=dont-follow
payment.simulator.enabled=false

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.threads.max=40
server.tomcat.accept-count=50
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.prometheus.metrics.export.enabled=true
management.tracing.propagation.type=w3c,b3
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}] 
