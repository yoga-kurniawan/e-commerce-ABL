apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: product-route
  namespace: ecommerce
spec:
  hosts:
    - "*"
  gateways:
    - istio-system/ecommerce-gateway
  http:
    - name: product-api
      match:
        - uri:
            exact: /api/v1/products
        - uri:
            prefix: /api/v1/products/
      route:
        - destination:
            host: abl-product-service.ecommerce.svc.cluster.local
            port:
              number: 8080
      timeout: 15s
