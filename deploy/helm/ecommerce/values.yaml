# Tag image lokal Minikube. Sesuaikan repository/tag atau pin digest untuk rilis.
# Alamat database harus dapat dijangkau Pod Kubernetes.
replicaCount: 1
imagePullSecrets: []
imagePullPolicy: IfNotPresent

service:
  port: 8080

management:
  port: 9090

javaToolOptions: "-XX:MaxRAMPercentage=50.0 -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=48m -Xss256k"

terminationGracePeriodSeconds: 35
preStopSleepSeconds: 5
tmpSizeLimit: 64Mi

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%

probes:
  startup:
    path: /actuator/health/liveness
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 60
  readiness:
    path: /actuator/health/readiness
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    path: /actuator/health/liveness
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}

podAnnotations: {}

istio:
  enabled: true
  gateway: istio-system/ecommerce-gateway
  timeout: 10s
  retries:
    attempts: 2
    perTryTimeout: 3s
    retryOn: connect-failure,refused-stream,5xx
  circuitBreaker:
    consecutive5xxErrors: 3
    interval: 10s
    baseEjectionTime: 30s
    maxConnections: 100
  mtlsStrict: true

services:
  product:
    enabled: true
    image:
      repository: ecommerce/product-service
      tag: "0.2.0-local"
      digest: ""
    database:
      host: product-db
      port: 5432
      name: product_db
      existingSecret: product-db-credentials
  cart:
    enabled: true
    image:
      repository: ecommerce/cart-service
      tag: "0.2.0-local"
      digest: ""
    database:
      host: cart-db
      port: 5432
      name: cart_db
      existingSecret: cart-db-credentials
  order:
    enabled: true
    image:
      repository: ecommerce/order-service
      tag: "0.2.0-local"
      digest: ""
    database:
      host: order-db
      port: 5432
      name: order_db
      existingSecret: order-db-credentials
  payment:
    enabled: true
    image:
      repository: ecommerce/payment-service
      tag: "0.2.0-local"
      digest: ""
    database:
      host: payment-db
      port: 5432
      name: payment_db
      existingSecret: payment-db-credentials
