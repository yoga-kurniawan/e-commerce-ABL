{{- if .Values.serviceAccount.create }}
{{- range $name, $service := .Values.services }}
{{- if $service.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ecommerce.serviceAccountName" (dict "serviceName" $name "context" $) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ecommerce.serviceLabels" (dict "serviceName" $name "context" $) | nindent 4 }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ default false $.Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
{{- end }}
