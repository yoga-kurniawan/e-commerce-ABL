{{- range $name, $service := .Values.services }}
{{- if $service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}-service
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}-service
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}-service
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      appProtocol: http
{{- end }}
{{- end }}
