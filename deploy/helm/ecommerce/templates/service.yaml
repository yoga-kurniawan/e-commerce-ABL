{{- range $name, $service := .Values.services }}
{{- if $service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecommerce.serviceName" (dict "serviceName" $name "context" $) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ecommerce.serviceLabels" (dict "serviceName" $name "context" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ecommerce.selectorLabels" (dict "serviceName" $name "context" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      targetPort: http
      appProtocol: http
{{- end }}
{{- end }}
