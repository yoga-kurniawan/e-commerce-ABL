{{- range $name, $service := .Values.services }}
{{- if $service.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecommerce.serviceName" (dict "serviceName" $name "context" $) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ecommerce.serviceLabels" (dict "serviceName" $name "context" $) | nindent 4 }}
spec:
  replicas: {{ $service.replicaCount | default $.Values.replicaCount }}
  {{- with ($service.strategy | default $.Values.strategy) }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ecommerce.selectorLabels" (dict "serviceName" $name "context" $) | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: {{ $.Values.management.port | quote }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $service.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ecommerce.serviceLabels" (dict "serviceName" $name "context" $) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ecommerce.serviceAccountName" (dict "serviceName" $name "context" $) }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}-service
          {{- if $service.image.digest }}
          image: {{ printf "%s@%s" $service.image.repository $service.image.digest | quote }}
          {{- else }}
          image: {{ printf "%s:%s" $service.image.repository $service.image.tag | quote }}
          {{- end }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- if gt (int ($.Values.preStopSleepSeconds | default 0)) 0 }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ $.Values.preStopSleepSeconds }}"]
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $.Values.service.port }}
              protocol: TCP
            - name: management
              containerPort: {{ $.Values.management.port }}
              protocol: TCP
          env:
            - name: APP_SECURITY_ENABLED
              value: {{ $.Values.auth.enabled | quote }}
            - name: APP_SECURITY_ISSUER
              value: {{ $.Values.auth.issuer | quote }}
            - name: APP_SECURITY_JWK_SET_URI
              value: {{ $.Values.auth.jwkSetUri | quote }}
            - name: APP_SECURITY_AUDIENCE
              value: {{ $.Values.auth.audience | quote }}
            - name: SERVER_PORT
              value: {{ $.Values.service.port | quote }}
            - name: MANAGEMENT_SERVER_PORT
              value: {{ $.Values.management.port | quote }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ $service.javaToolOptions | default $.Values.javaToolOptions | quote }}
            - name: SPRING_DATASOURCE_URL
              value: {{ printf "jdbc:postgresql://%s:%v/%s" $service.database.host $service.database.port $service.database.name | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $service.database.existingSecret | quote }}
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $service.database.existingSecret | quote }}
                  key: password
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "validate"
            - name: SPRING_JPA_OPEN_IN_VIEW
              value: "false"
            - name: SPRING_FLYWAY_ENABLED
              value: "true"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,prometheus"
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            - name: MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE
              value: "readinessState,db"
            {{- $clientJson := include "ecommerce.clientUrlsJson" (dict "serviceName" $name "context" $) -}}
            {{- if $clientJson }}
            # Gunakan nama property tepat, termasuk tanda hubung pada *-url.
            - name: SPRING_APPLICATION_JSON
              value: {{ $clientJson | quote }}
            {{- end }}
          {{- $probes := $service.probes | default $.Values.probes }}
          startupProbe:
            httpGet:
              path: {{ $probes.startup.path }}
              port: management
            periodSeconds: {{ $probes.startup.periodSeconds }}
            timeoutSeconds: {{ $probes.startup.timeoutSeconds | default 2 }}
            failureThreshold: {{ $probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ $probes.readiness.path }}
              port: management
            periodSeconds: {{ $probes.readiness.periodSeconds }}
            timeoutSeconds: {{ $probes.readiness.timeoutSeconds | default 2 }}
            failureThreshold: {{ $probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ $probes.liveness.path }}
              port: management
            periodSeconds: {{ $probes.liveness.periodSeconds }}
            timeoutSeconds: {{ $probes.liveness.timeoutSeconds | default 2 }}
            failureThreshold: {{ $probes.liveness.failureThreshold }}
          resources:
            {{- toYaml ($service.resources | default $.Values.resources) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ $.Values.tmpSizeLimit }}
{{- end }}
{{- end }}
