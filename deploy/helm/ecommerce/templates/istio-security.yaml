{{- if .Values.istio.enabled }}
{{- if .Values.istio.mtlsStrict }}
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: {{ include "ecommerce.fullname" . }}-default
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
spec:
  mtls:
    mode: STRICT
{{- end }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "ecommerce.fullname" . }}-default-deny-all
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
spec:
  {}
{{- range $name, $service := .Values.services }}
{{- if $service.enabled }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "ecommerce.serviceName" (dict "serviceName" $name "context" $) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ecommerce.serviceLabels" (dict "serviceName" $name "context" $) | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "ecommerce.selectorLabels" (dict "serviceName" $name "context" $) | nindent 6 }}
  action: ALLOW
  rules:
    {{- if and $.Values.istio.prometheus $.Values.istio.prometheus.principals }}
    {{- /* Catatan: Istio secara default (enablePrometheusMerge: true) menggabungkan metrik 127.0.0.1:9090/actuator/prometheus
           secara lokal ke port sidecar 15020/stats/prometheus. Rule di bawah adalah opsi kesiapan scraping langsung
           antar-workload jika Prometheus server dikonfigurasi dengan principal mTLS tertentu. */}}
    - from:
        - source:
            principals:
              {{- range $.Values.istio.prometheus.principals }}
              - {{ . | quote }}
              {{- end }}
      to:
        - operation:
            methods: ["GET"]
            ports: [{{ $.Values.management.port | quote }}]
            paths:
              - "/actuator/prometheus"
    {{- end }}
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway"
      to:
        - operation:
            ports: [{{ $.Values.service.port | quote }}]
            paths:
              - "/api/v1/{{ $name }}s"
              - "/api/v1/{{ $name }}s/*"
              - "/api/v2/{{ $name }}s"
              - "/api/v2/{{ $name }}s/*"
    {{- if eq $name "product" }}
    - from:
        - source:
            principals:
              - {{ printf "cluster.local/ns/%s/sa/%s" $.Release.Namespace (include "ecommerce.serviceAccountName" (dict "serviceName" "cart" "context" $)) | quote }}
      to:
        - operation:
            methods: ["GET"]
            ports: [{{ $.Values.service.port | quote }}]
            paths:
              - "/api/v1/products"
              - "/api/v1/products/*"
    - from:
        - source:
            principals:
              - {{ printf "cluster.local/ns/%s/sa/%s" $.Release.Namespace (include "ecommerce.serviceAccountName" (dict "serviceName" "order" "context" $)) | quote }}
      to:
        - operation:
            methods: ["GET"]
            ports: [{{ $.Values.service.port | quote }}]
            paths:
              - "/api/v1/products"
              - "/api/v1/products/*"
    {{- else if eq $name "cart" }}
    - from:
        - source:
            principals:
              - {{ printf "cluster.local/ns/%s/sa/%s" $.Release.Namespace (include "ecommerce.serviceAccountName" (dict "serviceName" "order" "context" $)) | quote }}
      to:
        - operation:
            methods: ["GET"]
            ports: [{{ $.Values.service.port | quote }}]
            paths:
              - "/api/v2/carts"
              - "/api/v2/carts/*"
    {{- else if eq $name "order" }}
    - from:
        - source:
            principals:
              - {{ printf "cluster.local/ns/%s/sa/%s" $.Release.Namespace (include "ecommerce.serviceAccountName" (dict "serviceName" "payment" "context" $)) | quote }}
      to:
        - operation:
            methods: ["GET"]
            ports: [{{ $.Values.service.port | quote }}]
            paths:
              - "/api/v1/orders"
              - "/api/v1/orders/*"
    {{- else if eq $name "payment" }}
    - from:
        - source:
            principals:
              - {{ printf "cluster.local/ns/%s/sa/%s" $.Release.Namespace (include "ecommerce.serviceAccountName" (dict "serviceName" "order" "context" $)) | quote }}
      to:
        - operation:
            methods: ["GET"]
            ports: [{{ $.Values.service.port | quote }}]
            paths:
              - "/api/v2/payments"
              - "/api/v2/payments/*"
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
