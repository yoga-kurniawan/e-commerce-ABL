# Local Minikube database. Credentials are supplied separately through a Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cart-db
  namespace: ecommerce
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: cart-db
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: cart-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: cart-db
  ports:
    - name: tcp-postgres
      port: 5432
      targetPort: tcp-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cart-db
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: cart-db
spec:
  serviceName: cart-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cart-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart-db
        # Database traffic is direct PostgreSQL TCP; application Pods use Istio.
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: cart-db
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17.11-bookworm
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: tcp-postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: cart_db
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cart-db-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cart-db-credentials
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          startupProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: socket
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: socket
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
# Enforcement requires a CNI that implements Kubernetes NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cart-db-from-cart
  namespace: ecommerce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cart-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cart-service
      ports:
        - protocol: TCP
          port: 5432
